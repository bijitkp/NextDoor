services:

  postgres:
    image: postgres:16
    container_name: db-postgres
    environment:
      POSTGRES_USER: nextdoor_admin
      POSTGRES_PASSWORD: nextdoor_password
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgressql:/docker-entrypoint-initdb.d
    restart: unless-stopped


  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    container_name: auth-service
    ports:
      - "8001:8000"
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      - postgres


  user-service:
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    container_name: user-service
    ports:
      - "8002:8000"
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      - postgres

volumes:
  postgres_data: