name: NextDoor CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  auth-service:

    runs-on: ubuntu-latest

    # Permission required to push packages to GHCR
    permissions:
      contents: read
      packages: write

    steps:

      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: services/auth-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python files
        working-directory: services/auth-service
        run: |
          python -m compileall .

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/nextdoor-auth-service:${{ github.sha }} -f services/auth-service/Dockerfile .

      - name: Push Docker image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/nextdoor-auth-service:${{ github.sha }}
